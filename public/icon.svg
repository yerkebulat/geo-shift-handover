<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1a472a" rx="64"/>

  <!-- Drill icon -->
  <g transform="translate(256,256)">
    <!-- Drill bit -->
    <path d="M -30,-180 L -30,-80 L -60,-40 L 0,80 L 60,-40 L 30,-80 L 30,-180 Z"
          fill="#d4a017" stroke="#ffffff" stroke-width="4"/>

    <!-- Drill body -->
    <rect x="-25" y="-200" width="50" height="20" fill="#888" stroke="#ffffff" stroke-width="2"/>

    <!-- Core sample lines -->
    <line x1="-15" y1="-140" x2="-15" y2="-100" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="-140" x2="0" y2="-100" stroke="#ffffff" stroke-width="2"/>
    <line x1="15" y1="-140" x2="15" y2="-100" stroke="#ffffff" stroke-width="2"/>

    <!-- Ground layers -->
    <line x1="-80" y1="100" x2="80" y2="100" stroke="#ffffff" stroke-width="3"/>
    <line x1="-90" y1="130" x2="90" y2="130" stroke="#cccccc" stroke-width="2"/>
    <line x1="-100" y1="160" x2="100" y2="160" stroke="#999999" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="256" y="460" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">
    GEO
  </text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Icon</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    canvas {
      border: 2px solid #ddd;
      margin: 20px 0;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    button {
      background: #1a472a;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background: #234f33;
    }
    .instructions {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>Generate a 512x512 PNG icon for the Geo Shift Handover app</p>

  <canvas id="icon" width="512" height="512"></canvas>

  <button onclick="downloadIcon()">Download icon-512.png</button>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Download icon-512.png" button above</li>
      <li>Save the file as <code>icon-512.png</code></li>
      <li>Move it to the <code>public/</code> folder</li>
      <li>Replace the existing icon (if any)</li>
      <li>Rebuild the app: <code>npm run build</code></li>
    </ol>
  </div>

  <script>
    // Draw icon on canvas
    const canvas = document.getElementById('icon');
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#1a472a';
    ctx.fillRect(0, 0, 512, 512);

    // Draw drill bit
    ctx.save();
    ctx.translate(256, 256);

    // Drill bit (gold)
    ctx.fillStyle = '#d4a017';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(-30, -180);
    ctx.lineTo(-30, -80);
    ctx.lineTo(-60, -40);
    ctx.lineTo(0, 80);
    ctx.lineTo(60, -40);
    ctx.lineTo(30, -80);
    ctx.lineTo(30, -180);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Drill body
    ctx.fillStyle = '#888888';
    ctx.fillRect(-25, -200, 50, 20);
    ctx.strokeRect(-25, -200, 50, 20);

    // Core sample lines
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-15, -140);
    ctx.lineTo(-15, -100);
    ctx.moveTo(0, -140);
    ctx.lineTo(0, -100);
    ctx.moveTo(15, -140);
    ctx.lineTo(15, -100);
    ctx.stroke();

    // Ground layers
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-80, 100);
    ctx.lineTo(80, 100);
    ctx.stroke();

    ctx.strokeStyle = '#cccccc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-90, 130);
    ctx.lineTo(90, 130);
    ctx.stroke();

    ctx.strokeStyle = '#999999';
    ctx.beginPath();
    ctx.moveTo(-100, 160);
    ctx.lineTo(100, 160);
    ctx.stroke();

    ctx.restore();

    // Title
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GEO', 256, 460);

    // Download function
    function downloadIcon() {
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'icon-512.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        alert('Icon downloaded! Save it to the public/ folder.');
      }, 'image/png');
    }
  </script>
</body>
</html>
